# Spring Boot Application Configuration

# Application Name
spring.application.name=smart-campus-api

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.servlet.session.timeout=30m

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus
spring.datasource.username=root
spring.datasource.password=rashmi123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Error Handling
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=always

# CORS Configuration
allowed.origins=http://localhost:3000,http://localhost:8080

# Application Info
app.name=Smart Campus
app.version=1.0.0
app.description=Smart Campus Management System
