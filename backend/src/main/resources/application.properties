# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (SQL Server Express named instance with Windows auth)
spring.datasource.url=jdbc:sqlserver://CHAMIDU;instanceName=SQLEXPRESS;databaseName=smart_campus;encrypt=true;trustServerCertificate=true;integratedSecurity=true;loginTimeout=30
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.format_sql=true

# OAuth 2.0 Google Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID_HERE
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# JWT Configuration
jwt.secret=your-super-secret-key-min-256-bits-long-for-security-smartcampus
jwt.expiration=86400000

# CORS
app.cors.allowedOrigins=http://localhost:3000
