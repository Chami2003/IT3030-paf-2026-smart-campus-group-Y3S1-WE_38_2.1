# Smart Campus Application Configuration

# Application Name
spring.application.name=smart-campus-api

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m

# Database Configuration (XAMPP MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# OAuth 2.0 Google Configuration
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# JWT Configuration
jwt.secret=your-super-secret-key-min-256-bits-long-for-security-smartcampus
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcampus=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Error Handling
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=always

# CORS Configuration
app.cors.allowedOrigins=http://localhost:3000,http://localhost:3001
allowed.origins=http://localhost:3000,http://localhost:3001,http://localhost:8080

# Application Info
app.name=Smart Campus
app.version=1.0.0
app.description=Smart Campus Management System

# Multipart Configuration (Increase limits for image uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
